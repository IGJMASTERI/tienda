<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapitas NFC - Tienda Oficial</title>
    <style>
        :root {
            --primary-color: #ff5e6c;
            --secondary-color: #ff9966;
            --bg-color: #f9f9f9;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: #222;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .store-container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        @media(max-width: 900px) {
            .store-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: #fff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            height: fit-content;
        }

        .panel h2 {
            margin-top: 0;
            font-size: 18px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .product-card {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
        }

        .product-card h3 {
            margin: 5px 0;
            font-size: 16px;
        }

        .price {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary-color);
            margin: 10px 0;
        }

        .btn-add {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .cart-items {
            list-style: none;
            padding: 0;
            margin: 0 0 10px 0;
            max-height: 120px;
            overflow-y: auto;
        }

        .cart-items li {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 6px;
            border-bottom: 1px dashed #eee;
            padding-bottom: 4px;
        }

        .cart-total {
            font-weight: bold;
            font-size: 15px;
            text-align: right;
            margin-bottom: 15px;
        }

        .checkout-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .checkout-form label {
            font-size: 12px;
            font-weight: bold;
            color: #444;
            margin-top: 5px;
        }

        .checkout-form input, .checkout-form textarea {
            width: 100%;
            padding: 9px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .checkout-form textarea {
            resize: none;
            height: 50px;
        }

        .error-msg {
            color: #d9534f;
            font-size: 11px;
            font-weight: bold;
            display: none;
            margin-top: -4px;
            margin-bottom: 4px;
        }

        .terms-check {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            margin-top: 12px;
            cursor: pointer;
        }

        .terms-link {
            color: var(--primary-color);
            text-decoration: underline;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-terms {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-terms-content {
            background: #fff;
            width: 100%;
            max-width: 450px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: left;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-terms-content h3 {
            margin-top: 0;
            color: #222;
        }

        .modal-terms-content p {
            font-size: 13px;
            color: #555;
            line-height: 1.5;
        }
