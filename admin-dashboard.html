<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Interna - PAWMI Admin</title>
    <link rel="icon" href="logo.jpeg">
    <style>
        :root {
            --primary-color: #8dae9b;
            --primary-dark: #628773;
            --secondary-color: #fbd3db;
            --accent-color: #c4e4d3;
            --yellow-pastel: #fef7e2;
            --light-color: #faf8f5;
            --bg-color: #f4f0eb;
            --card-bg: #ffffff;
            --text-color: #4a554f;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; box-sizing: border-box; }
        .admin-container { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(141, 174, 155, 0.1); border-top: 9px solid var(--primary-dark); }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--light-color); padding-bottom: 15px; margin-bottom: 25px; }
        .admin-header h2 { color: var(--primary-dark); margin: 0; font-size: 22px; }
        .btn-salir { background: #d9534f; color: white; border: none; padding: 8px 16px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-salir:hover { background: #c9302c; }

        .section-box { background: var(--light-color); border: 1px solid #ddecde; border-radius: 15px; padding: 20px; margin-bottom: 25px; }
        .section-box h3 { margin-top: 0; color: var(--primary-dark); font-size: 16px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; border-radius: 10px; overflow: hidden; font-size: 13px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; vertical-align: middle; }
        th { background: var(--primary-color); color: white; font-weight: bold; }
        
        .badge-estado { background: var(--yellow-pastel); color: var(--primary-dark); padding: 5px 10px; border-radius: 8px; font-weight: bold; font-size: 11px; border: 1px solid #f2ead0; display: inline-block; }
        
        .form-inline { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
        .form-inline input { padding: 8px 12px; border: 2px solid #ddecde; border-radius: 8px; font-size: 13px; }
        .btn-accion { background: var(--primary-dark); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-accion:hover { background: #4e6e5d; }

        .btn-ver-ficha { background: var(--primary-color); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-ver-ficha:hover { background: var(--primary-dark); }

        /* Estilos del Modal de Previsualización */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-box { background: white; width: 100%; max-width: 500px; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); position: relative; max-height: 90vh; overflow-y: auto; border-top: 8px solid var(--primary-color); text-align: left; }
        .close-x { position: absolute; top: 15px; right: 20px; font-size: 22px; cursor: pointer; color: #888; font-weight: bold; }
        
        .preview-ficha-card { background: linear-gradient(135deg, #ffffff, var(--yellow-pastel)); border: 2px solid var(--primary-color); border-radius: 15px; padding: 20px; text-align: center; margin: 15px 0; }
        .preview-avatar { width: 80px; height: 80px; border-radius: 6px; overflow: hidden; border: 1px solid #000; margin: 0 auto 10px auto; background: #eee; }
        .preview-avatar img { width: 100%; height: 100%; object-fit: contain; background: #000; }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="admin-header">
            <h2>🛠️ Panel de Gestión - PAWMI</h2>
            <button class="btn-salir" onclick="cerrarSesionAdmin()">Cerrar Sesión</button>
        </div>

        <!-- Control de Precios -->
        <div class="section-box">
            <h3>🏷️ Control de Precios de Productos</h3>
            <div class="form-inline">
                <label style="font-size: 12px; font-weight: bold;">Precio General de Placas ($):</label>
                <input type="number" id="inputNuevoPrecio" value="100">
                <button class="btn-accion" onclick="actualizarPrecioGlobal()">Actualizar Precio</button>
            </div>
        </div>

        <!-- Listado de Pedidos -->
        <div class="section-box">
            <h3>📦 Pedidos y Solicitudes Recibidas</h3>
            <div id="tablaPedidosContainer">
                <table>
                    <thead>
                        <tr>
                            <th>Orden</th>
                            <th>Cliente y Dirección de Despacho</th>
                            <th>Mascota & Producto</th>
                            <th>Total</th>
                            <th>Estado Actual</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="listaPedidosAdmin">
                        <!-- Se llena dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL DE PREVISUALIZACIÓN Y ENLACE NFC -->
    <div class="modal-overlay" id="modalFichaAdmin">
        <div class="modal-box">
            <span class="close-x" onclick="cerrarModalAdmin()">&times;</span>
            <h3 id="modalTituloPedido">Detalle del Pedido #--</h3>
            
            <div style="margin-bottom: 15px;">
                <label style="font-size: 11px; font-weight: 800; color: var(--primary-dark);">CAMBIAR ESTADO DEL PEDIDO:</label>
                <div style="display: flex; gap: 10px; margin-top: 5px;">
                    <select id="selectEstadoPedido" style="padding: 8px; border-radius: 8px; border: 2px solid #ddecde; font-weight: bold; flex: 1;">
                        <option value="Recibido / Pendiente">Recibido / Pendiente</option>
                        <option value="En Grabación NFC">En Grabación NFC</option>
                        <option value="Despachado">Despachado</option>
                        <option value="Entregado">Entregado</option>
                    </select>
                    <button class="btn-accion" onclick="guardarNuevoEstado()">Guardar</button>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px dashed #eee; margin: 15px 0;">

            <!-- SECCIÓN DEL ENLACE NFC CON BOTÓN DE COPIADO RÁPIDO -->
            <div style="background: var(--light-color); padding: 12px; border-radius: 10px; border: 1px solid #ddecde; margin-bottom: 15px;">
                <label style="font-size: 11px; font-weight: 800; color: var(--primary-dark);">ENLACE NFC PARA GRABAR (NFC Tools):</label>
                <div style="display: flex; gap: 8px; margin-top: 5px; align-items: center;">
                    <input type="text" id="inputUrlNfcModal" readonly style="flex: 1; padding: 6px 10px; font-size: 11px; border: 1px solid #ccc; border-radius: 6px; background: #fff; color: #333;">
                    <button class="btn-accion" style="padding: 6px 12px; font-size: 12px;" onclick="copiarEnlaceNfc()">📋 Copiar</button>
                </div>
            </div>

            <h4 style="color: var(--primary-dark); margin-bottom: 5px; font-size: 13px;">👁️ Previsualización de la Ficha NFC:</h4>
            <div class="preview-ficha-card" id="previewFichaContenido"></div>
        </div>
    </div>

    <script>
        const adminToken = localStorage.getItem('pawmi_admin_token');
        if (!adminToken) {
            alert('Acceso no autorizado. Inicia sesión como administrador.');
            window.location.href = 'admin.html';
        }

        function cerrarSesionAdmin() {
            localStorage.removeItem('pawmi_admin_token');
            window.location.href = 'admin.html';
        }

        function actualizarPrecioGlobal() {
            const nuevoPrecio = document.getElementById('inputNuevoPrecio').value;
            localStorage.setItem('pawmi_precio_config', nuevoPrecio);
            alert(`¡Precio actualizado con éxito a $${Number(nuevoPrecio).toLocaleString('es-CL')}!`);
        }

        // Datos de ejemplo para prueba (aquí conectaremos con tu base de datos de pedidos reales)
        let pedidosGlobales = [
            {
                orden: '#O_94821',
                cliente: 'Anais Zapata',
                telefono: '+56972930605',
                direccion: 'Volcán Llaima #5870, La Florida, Región Metropolitana',
                producto: 'Placa de Perro (Estándar)',
                mascota: 'Andy',
                detalle: 'Pincher, 6 años',
                dueno: 'Anais Zapata',
                fonoEmergencia: '+56972930605',
                alergias: 'Alérgico al pollo',
                foto: 'logo.jpeg',
                total: 100,
                estado: 'Recibido / Pendiente',
                nfcUrl: 'https://ficha-animales.pages.dev/pet.html?mascota=andy_94821&tel=+56972930605'
            }
        ];

        let pedidoSeleccionadoIndex = null;

        function cargarPedidosAdmin() {
            const tbody = document.getElementById('listaPedidosAdmin');
            tbody.innerHTML = '';

            if(pedidosGlobales.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #888;">No hay pedidos registrados.</td></tr>';
                return;
            }

            pedidosGlobales.forEach((p, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${p.orden}</strong></td>
                    <td>
                        <strong>${p.cliente}</strong><br>
                        <small>📞 ${p.telefono}</small><br>
                        <small style="color: #666;">📍 <strong>Despacho:</strong> ${p.direccion}</small>
                    </td>
                    <td>
                        🐾 <strong>${p.mascota}</strong><br>
                        <small>${p.producto}</small>
                    </td>
                    <td>$${p.total.toLocaleString('es-CL')}</td>
                    <td><span class="badge-estado" id="badgeEstado_${index}">${p.estado}</span></td>
                    <td>
                        <button class="btn-ver-ficha" onclick="abrirModalAdmin(${index})">👁️ Ver Ficha y Link</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function abrirModalAdmin(index) {
            pedidoSeleccionadoIndex = index;
            const p = pedidosGlobales[index];

            document.getElementById('modalTituloPedido').textContent = `Gestión de Pedido ${p.orden}`;
            document.getElementById('selectEstadoPedido').value = p.estado;
            document.getElementById('inputUrlNfcModal').value = p.nfcUrl || 'https://ficha-animales.pages.dev/pet.html?mascota=' + p.mascota.toLowerCase();

            const previewBox = document.getElementById('previewFichaContenido');
            previewBox.innerHTML = `
                <div class="preview-avatar">
                    <img src="${p.foto || 'logo.jpeg'}" alt="Foto mascota">
                </div>
                <div style="font-weight: 900; font-size: 15px; color: var(--primary-dark);">¡Hola, soy ${p.mascota}!</div>
                <div style="font-size: 11px; color: #555; margin: 3px 0;">🐾 Detalle: ${p.detalle}</div>
                <div style="font-size: 11px; color: #555; margin: 3px 0;">👤 Dueño/a: ${p.dueno}</div>
                <div style="font-size: 11px; color: #555; margin: 3px 0;">📞 Teléfono: ${p.fonoEmergencia}</div>
                <div style="font-size: 11px; color: #d9534f; margin: 3px 0;">⚠️ Alergias: ${p.alergias}</div>
            `;

            document.getElementById('modalFichaAdmin').style.display = 'flex';
        }

        function cerrarModalAdmin() {
            document.getElementById('modalFichaAdmin').style.display = 'none';
        }

        function copiarEnlaceNfc() {
            const inputLink = document.getElementById('inputUrlNfcModal');
            inputLink.select();
            inputLink.setSelectionRange(0, 99999); // Para móviles y tablets
            navigator.clipboard.writeText(inputLink.value).then(() => {
                alert('¡Enlace NFC copiado al portapapeles con éxito! Ya puedes pegarlo en NFC Tools.');
            }).catch(err => {
                console.error('Error al copiar: ', err);
                alert('No se pudo copiar automáticamente. Selecciónalo y cópialo manualmente.');
            });
        }

        function guardarNuevoEstado() {
            if (pedidoSeleccionadoIndex !== null) {
                const nuevoEstado = document.getElementById('selectEstadoPedido').value;
                pedidosGlobales[pedidoSeleccionadoIndex].estado = nuevoEstado;
                
                cargarPedidosAdmin();
                cerrarModalAdmin();
                alert(`¡Estado del pedido actualizado a: "${nuevoEstado}" con éxito!`);
            }
        }

        cargarPedidosAdmin();
    </script>
</body>
</html>
