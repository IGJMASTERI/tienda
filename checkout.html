<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Webpay - PAWMI</title>
    <link rel="icon" href="logo.jpeg">
    <style>
        :root {
            --primary-color: #8dae9b;
            --primary-dark: #628773;
            --secondary-color: #fbd3db;
            --accent-color: #c4e4d3;
            --yellow-pastel: #fef7e2;
            --light-color: #faf8f5;
            --bg-color: #f4f0eb;
            --card-bg: #ffffff;
            --text-color: #4a554f;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; box-sizing: border-box; }
        .checkout-container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(141, 174, 155, 0.1); border-top: 9px solid var(--secondary-color); }
        h2 { color: var(--primary-dark); margin-top: 0; border-bottom: 2px solid var(--light-color); padding-bottom: 10px; }
        .cart-summary-list { list-style: none; padding: 0; margin: 0 0 20px 0; }
        .cart-summary-list li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
        .total-box { font-size: 18px; font-weight: 800; text-align: right; color: var(--primary-dark); margin-bottom: 25px; }
        .form-section { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        @media(max-width: 600px) { .form-section { grid-template-columns: 1fr; } }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label { font-size: 12px; font-weight: 800; color: var(--primary-dark); }
        .form-group input { padding: 12px; border: 2px solid #ddecde; border-radius: 10px; font-size: 14px; background: #fafdfa; }
        .form-group input:focus { outline: none; border-color: var(--secondary-color); box-shadow: 0 0 0 3px rgba(251,211,219,0.3); }
        .btn-webpay { background: #002d62; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 900; font-size: 15px; cursor: pointer; width: 100%; transition: background 0.2s; box-shadow: 0 4px 15px rgba(0,45,98,0.2); display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-webpay:hover { background: #001f44; }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--primary-dark); text-decoration: none; font-weight: bold; background: var(--yellow-pastel); padding: 7px 14px; border-radius: 20px; font-size: 13px; border: 1px solid #f2ead0; }
    </style>
</head>
<body>

    <div style="max-width: 800px; margin: 0 auto;"><a href="index.html" class="back-link">← Volver a la Tienda</a></div>

    <div class="checkout-container">
        <h2>💳 Pagar con Webpay Plus</h2>
        
        <ul class="cart-summary-list" id="resumenCarrito"></ul>
        <div class="total-box">Total a Pagar: $<span id="totalPagar">0</span></div>

        <form onsubmit="iniciarPagoWebpay(event)">
            <div class="form-section">
                <div class="form-group"><label>NOMBRE DEL CLIENTE</label><input type="text" id="nombreCliente" required placeholder="Tu nombre y apellido"></div>
                <div class="form-group"><label>TELÉFONO DE CONTACTO</label><input type="tel" id="fonoCliente" required placeholder="+569xxxxxxxx"></div>
                <div class="form-group"><label>NOMBRE DE LA MASCOTA</label><input type="text" id="nombreMascota" required placeholder="Ej: Toby o Luna"></div>
                <div class="form-group"><label>TELÉFONO DE EMERGENCIA (PARA NFC)</label><input type="tel" id="fonoEmergencia" required placeholder="Número para la chapita"></div>
                <div class="form-group full"><label>DIRECCIÓN DE ENVÍO</label><input type="text" id="dirCliente" required placeholder="Calle, número, comuna"></div>
            </div>
            <button type="submit" class="btn-webpay" id="btnPagar">
                <span>Pagar de forma segura con Webpay ➔</span>
            </button>
        </form>
    </div>

    <script>
        let carrito = JSON.parse(localStorage.getItem('chapitas_carrito') || '[]');
        const resumenLista = document.getElementById('resumenCarrito');
        const totalSpan = document.getElementById('totalPagar');
        let total = 0;

        if (carrito.length === 0) {
            resumenLista.innerHTML = '<li>Tu carrito está vacío.</li>';
        } else {
            carrito.forEach(item => {
                total += item.precio;
                const li = document.createElement('li');
                li.innerHTML = `<span>${item.producto || item.nombre}</span> <span>$${item.precio.toLocaleString('es-CL')}</span>`;
                resumenLista.appendChild(li);
            });
        }
        totalSpan.textContent = total.toLocaleString('es-CL');

        async function iniciarPagoWebpay(e) {
            e.preventDefault();
            const btn = document.getElementById('btnPagar');
            btn.disabled = true;
            btn.textContent = 'Conectando con Webpay...';

            const mascota = document.getElementById('nombreMascota').value;
            const fonoEmergencia = document.getElementById('fonoEmergencia').value;
            const mascotaIdSlug = mascota.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_') + '_' + Math.floor(Math.random() * 9000 + 1000);
            const nfcUrl = `https://pawmi.cl/pet.html?mascota=${mascotaIdSlug}&tel=${fonoEmergencia}`;

            const datosCliente = {
                cliente: document.getElementById('nombreCliente').value,
                fono: document.getElementById('fonoCliente').value,
                mascota,
                fonoEmergencia,
                direccion: document.getElementById('dirCliente').value,
                nfcUrl,
                productos: carrito
            };

            try {
                // Reemplaza esta URL con la URL real de tu servicio en Render
                const response = await fetch('https://TU-URL-DE-RENDER.onrender.com/api/iniciar-pago', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ total, datosCliente })
                });

                const data = await response.json();
                if (data.url && data.token) {
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = data.url;

                    const inputToken = document.createElement('input');
                    inputToken.type = 'hidden';
                    inputToken.name = 'token_ws';
                    inputToken.value = data.token;

                    form.appendChild(inputToken);
                    document.body.appendChild(form);
                    form.submit();
                } else {
                    alert('Error al iniciar el pago con Webpay.');
                    btn.disabled = false;
                    btn.textContent = 'Pagar de forma segura con Webpay ➔';
                }
            } catch (err) {
                console.error(err);
                alert('No se pudo conectar con el servidor de pagos.');
                btn.disabled = false;
                btn.textContent = 'Pagar de forma segura con Webpay ➔';
            }
        }
    </script>
</body>
</html>
